services:
  _defaults:
    public: true

  # ============== Queries

  Novanta\OrderPayment\Adapter\OrderInvoice\QueryHandler\GetOrderInvoicesHandler:
    class: 'Novanta\OrderPayment\Adapter\OrderInvoice\QueryHandler\GetOrderInvoicesHandler'
    arguments:
      - '@Novanta\OrderPayment\Adapter\OrderInvoice\Repository\OrderInvoiceRepository'
      - "@=service('prestashop.adapter.legacy.context').getContext().language.id"
    autoconfigure: true

  # ============== Commands

  Novanta\OrderPayment\Adapter\OrderInvoice\CommandHandler\AddOrderInvoiceHandler:
    class: 'Novanta\OrderPayment\Adapter\OrderInvoice\CommandHandler\AddOrderInvoiceHandler'
    arguments:
      - '@prestashop.adapter.legacy.configuration'
      - '@Novanta\OrderPayment\Adapter\PDF\OrderInvoiceProformaPdfGenerator'
      - '@prestashop.adapter.context_state_manager'
      - '@prestashop.core.admin.lang.repository'
      - '@prestashop.core.command_bus'
      - '@Novanta\OrderPayment\Adapter\OrderInvoice\Repository\OrderInvoiceRepository'
    autoconfigure: true

  Novanta\OrderPayment\Adapter\OrderInvoice\CommandHandler\DeleteOrderInvoiceHandler:
    class: 'Novanta\OrderPayment\Adapter\OrderInvoice\CommandHandler\DeleteOrderInvoiceHandler'
    autoconfigure: true

  Novanta\OrderPayment\Adapter\OrderInvoice\CommandHandler\EditOrderInvoiceHandler:
    class: 'Novanta\OrderPayment\Adapter\OrderInvoice\CommandHandler\EditOrderInvoiceHandler'
    arguments:
      - '@prestashop.adapter.legacy.configuration'
      - '@Novanta\OrderPayment\Adapter\PDF\OrderInvoiceProformaPdfGenerator'
      - '@prestashop.adapter.context_state_manager'
      - '@prestashop.core.admin.lang.repository'
      - '@prestashop.core.command_bus'
      - '@Novanta\OrderPayment\Adapter\OrderInvoice\Repository\OrderInvoiceRepository'
    autoconfigure: true